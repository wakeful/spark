version: "2"
linters:
  default: all
  disable:
    - dupl
    - exhaustruct # deprecated since v2.13.0
    - exhaustruct_v5
    - gomodguard # deprecated since v2.12.0
    - wsl # deprecated (since v2.2.0)
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/aws/aws-sdk-go-v2/aws
            - github.com/aws/aws-sdk-go-v2/config
            - github.com/aws/aws-sdk-go-v2/service/ec2
            - github.com/aws/aws-sdk-go-v2/service/ec2/types
            - github.com/aws/aws-sdk-go-v2/service/rds
            - github.com/aws/aws-sdk-go-v2/service/ssm
            - github.com/aws/aws-sdk-go-v2/service/sts
            - github.com/wakeful/spark
            - golang.org/x/sync/errgroup
  exclusions:
    generated: enable
    rules:
      - path: gen/
        linters:
          - exhaustruct # deprecated since v2.13.0
          - exhaustruct_v5
      - path: main.go
        linters:
          - funlen
      - path: (gen_.*|_string).go
        linters:
          - gochecknoglobals
      - path: _test.go
        linters:
          - dupl
          - err113
          - exhaustruct # deprecated since v2.13.0
          - exhaustruct_v5
          - funlen
          - goconst
          - varnamelen
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
